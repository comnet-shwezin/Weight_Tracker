<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Offline-first weight tracker with local storage. Track your weight, calculate changes, and view progress charts without internet." />
    <title>Weight Tracker</title>
    <!-- App Icon and iOS Support -->
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weight Tracker" />
    <!-- Web App Manifest for Phone Installation -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then((registration) => {
              console.log('✓ Service Worker registered:', registration);
            })
            .catch((error) => {
              console.log('✗ Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
